# Regression nightly (M4 Task 5) — full non-device suite + gated network tests.
#
# Plan ref: docs/plans/M4-cicd.md §3 in-scope, §2 done-criteria sub-point 4-5.
#
# Trigger:
#   - Cron `0 2 * * *` UTC (≈ 09:00 ICT VN) mỗi ngày.
#   - `workflow_dispatch` cho manual smoke check sau merge gấp.
#
# Khác `ci.yml`:
#   - `ALLOW_NETWORK_INTEGRATION=1` → 2 gated integration tests chạy real httpbin.
#   - Allure artifact retention 30 ngày (vs 7 ngày CI).
#
# Plan v1.1 (revised 2026-04-28 — solo-local focus):
#   - Allure host (Task 6) + Slack notify (Task 7) → DEFER M5. M4 dùng artifact
#     download (zip → unzip → mở `index.html` local). GitHub Actions native
#     notification + manual Actions tab check đủ cho solo dev.
name: Regression (nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  verify:
    name: regression (full + network gated)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ALLOW_NETWORK_INTEGRATION: '1'
      ACCOUNT_POOL_CONFIG_PATH: ./src/utils/accountPool/pool.config.json
      ACCOUNT_POOL_STATE_PATH: ./tmp/account-pool.state.json
      ANDROID_DEVICE_NAME: ci-stub
      ANDROID_PLATFORM_VERSION: '13'
      APP_PATH: ./apps/SauceLabs-Demo-App.apk
      ENV_PROFILE: local
      NETWORK_SIM_DEFAULT: full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Quarantine deadline check
        run: npm run check:quarantine

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (gated network ON — real httpbin via ALLOW_NETWORK_INTEGRATION=1)
        run: npm run test:integration

      - name: API contract test (AC_API_DEMO_001)
        run: npm run test:api

      - name: Upload Allure results (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-${{ github.run_id }}
          path: reports/allure-results
          if-no-files-found: ignore
          retention-days: 30

      # Plan v1.1 (2026-04-28): Allure host + Slack notify defer M5. Workflow
      # giữ artifact upload only — anh download zip → unzip → mở `index.html`
      # khi cần xem report. M5 plan revisit khi có team / dashboard tool.
