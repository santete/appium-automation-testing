# M5 Task 5 — auto-load dashboards from /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: M5-default
    folder: 'Test Quality'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
