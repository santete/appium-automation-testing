# M5 Task 5 — Observability stack (InfluxDB 2 + Grafana 10).
#
# Boot:
#   docker compose -f infra/observability/docker-compose.yaml up -d
#
# Acceptance (M5 plan §2 sub-point 2):
#   - Dashboard accessible from share link < 30s after new run.
#   - 6 KPI panels: pass rate (7d), flaky rate, top-5 flaky tests,
#     MTTR, coverage %, P95 execution time.
#
# Idempotent: bucket + datasource + dashboard auto-provisioned từ files
# (xem grafana-provisioning/, influxdb-init.flux). KHÔNG manual click setup.
#
# Network: localhost-only — KHÔNG expose ra LAN/internet (M6 sẽ wire reverse
# proxy + auth khi cần share team).

services:
  influxdb:
    image: influxdb:2.7
    container_name: m5-influxdb
    restart: unless-stopped
    ports:
      - '127.0.0.1:8086:8086'
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-changeme-local-only}
      DOCKER_INFLUXDB_INIT_ORG: mobile-automation
      DOCKER_INFLUXDB_INIT_BUCKET: test-runs
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:-local-dev-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - ./influxdb-init.flux:/docker-entrypoint-initdb.d/init.flux:ro
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: m5-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN:-local-dev-token-change-me}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  influxdb-data:
  grafana-data:
